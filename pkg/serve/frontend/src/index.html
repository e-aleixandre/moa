<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <!-- --base, matching the conversation surface: this paints the iOS status-bar
       area in the installed PWA, and --crust showed as a darker band there. -->
  <meta name="theme-color" content="#1e1e2e">
  <!-- NO apple-mobile-web-app-capable: that legacy iOS home-screen mode needs a
       matching apple-touch-startup-image per device or iOS letterboxes the app
       to a legacy 812pt viewport on devices newer than the mode (e.g. iPhone 17
       Pro showed a ~150px native band below the webview). The manifest's
       display:standalone is the modern path iOS 16.4+ uses, and it gets the real
       full-screen viewport. status-bar-style below only applied in that legacy
       mode; theme-color drives the status bar in standalone. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="moa">
  <title>moa</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
