<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <!-- --base, matching the conversation surface: this paints the iOS status-bar
       area in the installed PWA, and --crust showed as a darker band there. -->
  <meta name="theme-color" content="#1e1e2e">
  <!-- Home Screen web app chrome is driven entirely by manifest.webmanifest
       (display:standalone) — the modern iOS 16.4+ path. The legacy meta opt-ins
       are deliberately absent:
       - apple-mobile-web-app-capable / mobile-web-app-capable: redundant once the
         manifest declares standalone.
       - apple-mobile-web-app-status-bar-style=black-translucent: deprecated by
         WebKit and part of the geometry that made iOS 26 standalone drop the
         status-bar height twice, leaving a native strip below the webview on an
         iPhone 17 Pro (viewport came back 402x812 = 402x(874-62)). theme-color
         colors the status bar without requesting the deprecated translucent mode.
       See WebKit bugs 313800 / 300445 for the underlying iOS 26 shell regression. -->
  <meta name="apple-mobile-web-app-title" content="moa">
  <title>moa</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
