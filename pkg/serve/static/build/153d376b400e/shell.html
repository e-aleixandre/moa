<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <!-- --base, matching the conversation surface: this paints the iOS status-bar
       area in the installed PWA, and --crust showed as a darker band there. -->
  <meta name="theme-color" content="#1e1e2e">
  <!-- Home Screen web app chrome comes from manifest.webmanifest
       (display:standalone), the modern iOS 16.4+ path; since iOS 26 any site
       added to the Home Screen opens as a web app by default. The capability
       metas are kept only as a redundant opt-in for older iOS and other
       browsers — they do not affect the viewport, and they do NOT make WebKit
       remember a microphone grant (bug 280394 is still open: Home Screen web
       apps have no persistent getUserMedia permission at all).

       Still deliberately absent:
       apple-mobile-web-app-status-bar-style=black-translucent — deprecated by
       WebKit and the actual cause of the iOS 26 geometry bug that made the
       standalone shell subtract the status-bar height twice, leaving a native
       strip below the webview on an iPhone 17 Pro (viewport came back
       402x812 = 402x(874-62)). theme-color colors the status bar instead.
       See WebKit bugs 313800 / 300445. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="moa">
  <title>moa</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/build/153d376b400e/app.css">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/build/153d376b400e/app.js"></script>
</body>
</html>
