name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: 1.25.13

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            pkg/serve/frontend/package-lock.json

      - name: Build frontend
        working-directory: pkg/serve/frontend
        run: |
          npm ci
          npm run build

      # The bundle under pkg/serve/static is generated but versioned (it ships
      # via go:embed, so `go install` works without Node). Same contract as
      # go.sum below: rebuilding it must be a no-op, or the commit that left it
      # stale fails here instead of surfacing days later as a dirty tree in the
      # release job.
      - name: Check frontend bundle is up to date
        run: |
          # --intent-to-add so a brand new build directory (the usual shape of
          # a stale bundle: the id changes, so the whole folder is untracked)
          # shows up in the diff instead of passing unnoticed.
          git add --intent-to-add -- pkg/serve/static
          git diff --exit-code -- pkg/serve/static

      - name: Build
        run: go build ./...
        env:
          GOFLAGS: -mod=readonly

      - name: Check go.sum tidy
        run: |
          go mod tidy
          git diff --exit-code go.sum

      - name: Test
        run: go test -race -count=1 ./...

      - name: Check Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Audit production frontend dependencies
        working-directory: pkg/serve/frontend
        run: npm audit --omit=dev --audit-level=high


  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: 1.25.13

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            pkg/serve/frontend/package-lock.json

      - name: Build frontend
        working-directory: pkg/serve/frontend
        run: |
          npm ci
          npm run build


      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.3
