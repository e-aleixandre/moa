name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.9

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            pkg/serve/frontend/package-lock.json

      - name: Build frontend
        working-directory: pkg/serve/frontend
        run: |
          npm ci
          npm run build

      # The bundle under pkg/serve/static is generated but versioned (it ships
      # via go:embed, so `go install` works without Node). Same contract as
      # go.sum below: rebuilding it must be a no-op, or the commit that left it
      # stale fails here instead of surfacing days later as a dirty tree in the
      # release job.
      - name: Check frontend bundle is up to date
        run: |
          # --intent-to-add so a brand new build directory (the usual shape of
          # a stale bundle: the id changes, so the whole folder is untracked)
          # shows up in the diff instead of passing unnoticed.
          git add --intent-to-add -- pkg/serve/static
          git diff --exit-code -- pkg/serve/static

      - name: Build
        run: go build ./...
        env:
          GOFLAGS: -mod=readonly

      - name: Check go.sum tidy
        run: |
          go mod tidy
          git diff --exit-code go.sum

      - name: Test
        # pkg/serve alone takes close to go test's default 10 minutes with
        # -race; splitting it is pending.
        run: go test -race -count=1 -timeout=20m ./...

      - name: Check Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

      - name: Audit production frontend dependencies
        working-directory: pkg/serve/frontend
        run: npm audit --omit=dev --audit-level=high


  # The Markdown sanitizer is security-relevant and only testable in a real
  # browser (bun tests stub DOMPurify). The runner's preinstalled Chrome avoids
  # a browser download; playwright-core stays out of package.json on purpose.
  markdown-security:
    name: Markdown security (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            pkg/serve/frontend/package-lock.json

      - name: Test
        working-directory: pkg/serve/frontend
        run: |
          npm ci
          npm i --no-save playwright-core@1.63.0
          MOA_CHROMIUM_PATH="$(command -v google-chrome)" node --test scripts/markdown-security.test.mjs

  relay:
    name: Push relay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            relay/package-lock.json

      - name: Test
        working-directory: relay
        run: |
          npm ci
          npm test

  # Only worth the minutes when the app, the relay it talks to, or this
  # workflow changed. Unknown base (new branch, force push, workflow_call from
  # another event) runs everything rather than silently skipping.
  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # grep must consume all input: with -q it exits early and pipefail turns
          # git's SIGPIPE into a false negative.
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            if git diff --name-only "$BASE" HEAD | grep -E '^(mobile/|relay/|\.github/workflows/ci\.yml$)' >/dev/null; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "No changes under mobile/ or relay/; skipping."
            fi
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.changes.outputs.run == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            mobile/android/**/*.gradle*
            mobile/android/gradle/wrapper/gradle-wrapper.properties

      - if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json

      - if: steps.changes.outputs.run == 'true'
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        if: steps.changes.outputs.run == 'true'
        working-directory: mobile
        run: npm ci

      - name: JS tests
        if: steps.changes.outputs.run == 'true'
        working-directory: mobile
        run: bun test ./www/*.test.js ./android-contract.test.js ./privacy-contract.test.js ./server-recovery-contract.test.js

      # Copies the web assets into the (ignored) android assets dir so the APK
      # is complete; the gradle project itself resolves plugins from
      # node_modules, which npm ci already provides.
      - name: Capacitor sync
        if: steps.changes.outputs.run == 'true'
        working-directory: mobile
        run: npx cap sync android

      # No google-services.json here: build.gradle skips the plugin without it.
      - name: Build and unit-test
        if: steps.changes.outputs.run == 'true'
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.9

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            pkg/serve/frontend/package-lock.json

      - name: Build frontend
        working-directory: pkg/serve/frontend
        run: |
          npm ci
          npm run build

      # Two mechanical rules a reviewer cannot reliably check by eye: no
      # editable control below 16px (iOS Safari zooms the PWA when one takes
      # focus), and no new raw <input> now that there is a Field primitive.
      # scripts/check-fields.mjs carries the documented exceptions.
      - name: Check field rules
        working-directory: pkg/serve/frontend
        run: npm run check:fields

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
