name: iOS app

# Builds the native container and uploads it to App Store Connect (TestFlight).
#
# STATUS: this workflow has not been run. Releases are currently built and
# uploaded from the maintainer's Mac; the workflow is kept for the day that
# moves to CI. Treat it as a draft: the signing steps in particular have only
# been checked for syntax and for how Xcode expands their build settings, not
# against a real certificate and real profiles.
#
# Deliberately manual: this is not part of CI. Every other job here proves the
# repository is sound and costs nothing; this one signs with a real developer
# identity, consumes macOS runner minutes (ten times the price of Linux), and
# puts a build in front of a person. That should be a decision, not a
# consequence of pushing a commit.
#
# The frontend is NOT bundled into the app: the container loads it from the
# moa it was paired with (see mobile/README.md), so shipping interface changes
# does not need this workflow at all. Run it when the container itself changes
# -- native plugins, capabilities, icons, the bundle id.
#
# The build carries no server address: which moa it talks to is decided on the
# device, by pairing.
#
# Three targets are signed, each with its own App Store provisioning profile:
# the app and its two extensions (NotificationService, ShareExtension). Their
# bundle ids are the ones in mobile/ios/App/App.xcodeproj/project.pbxproj.

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What testers should look at"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ios-app
  cancel-in-progress: false

jobs:
  testflight:
    name: Build & upload
    # Xcode only exists on macOS runners. macos-15 carries Xcode 16, which is
    # the minimum that can submit builds for iOS 18 and later.
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # Keep in step with PRODUCT_BUNDLE_IDENTIFIER / MOA_*_BUNDLE_IDENTIFIER
      # in project.pbxproj.
      BUNDLE_ID_APP: com.ealeixandre.moa.app
      BUNDLE_ID_NOTIFICATION_SERVICE: com.ealeixandre.moa.app.NotificationService
      BUNDLE_ID_SHARE_EXTENSION: com.ealeixandre.moa.app.ShareExtension

    steps:
      - uses: actions/checkout@v6
        with:
          # Tags are how moa's version is known (.goreleaser.yml derives it
          # from them), and a shallow clone has none.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install container dependencies
        working-directory: mobile
        run: npm ci

      # Two numbers, because iOS has two and they answer different questions.
      #
      # The visible version is moa's own, taken from the last tag: an app and a
      # server that disagree are worth noticing, and this is what says so in
      # TestFlight and in Settings. It is informative rather than a guarantee --
      # the interface is always the server's, so what can actually drift is the
      # container: a native capability an older app does not carry.
      #
      # The build number is just the run: Apple requires every upload to be
      # higher than the last, and the container is rebuilt for its own reasons
      # (a plugin, an icon, a permission) far less often and out of step with
      # moa's releases. Tying it to the version would refuse the second build
      # of any given release.
      - name: Work out the version
        id: version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')
          if [ -z "$VERSION" ]; then VERSION=0.0.0; fi
          echo "marketing=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "moa $VERSION, build ${{ github.run_number }}"

      # The Xcode project is committed (see mobile/README.md): it carries two
      # extension targets, which `cap add ios` would remove. `cap sync` only
      # copies the web assets and runs `pod install`.
      - name: Sync the Xcode project
        working-directory: mobile
        run: |
          npx cap sync ios
          # The committed Info.plist already carries the usage strings, and
          # PlistBuddy's Add fails on an existing key: add only what is missing.
          /usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' \
            ios/App/App/Info.plist > /dev/null 2>&1 ||
          /usr/libexec/PlistBuddy -c \
            'Add :NSCameraUsageDescription string "moa uses the camera to scan a pairing code."' \
            ios/App/App/Info.plist
          # Dictation is the reason to want a microphone, and iOS will not ask
          # for one without a sentence to show the person being asked.
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' \
            ios/App/App/Info.plist > /dev/null 2>&1 ||
          /usr/libexec/PlistBuddy -c \
            'Add :NSMicrophoneUsageDescription string "moa uses the microphone to dictate messages."' \
            ios/App/App/Info.plist
          # No UIBackgroundModes: the app does not record or play audio in the
          # background, and declaring a mode it does not use is grounds for
          # App Review to reject it.

      # The icon is generated from one 1024px source rather than committed as
      # a catalogue of twenty crops: the crops are derived, and a derived file
      # in git is a file that will disagree with its source one day.
      - name: Generate the app icon
        working-directory: mobile
        run: npx @capacitor/assets generate --ios --iconBackgroundColor '#1e1e2e'

      # A keychain of its own, unlocked for this job only: the runner is
      # ephemeral, but a build should never be able to read or write the
      # default login keychain.
      #
      # Each profile is installed under its UUID and checked against the bundle
      # id it is meant for: a profile pasted into the wrong secret otherwise
      # fails much later, in the archive, with a message about entitlements.
      # Its name is what Xcode and the export plist look it up by.
      - name: Install the signing certificate and profiles
        env:
          CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_APP: ${{ secrets.IOS_PROFILE_APP }}
          PROFILE_NOTIFICATION_SERVICE: ${{ secrets.IOS_PROFILE_NOTIFICATION_SERVICE }}
          PROFILE_SHARE_EXTENSION: ${{ secrets.IOS_PROFILE_SHARE_EXTENSION }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 1800 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo -n "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

          PROFILES=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PROFILES"

          # install_profile <base64 profile> <bundle id> <env var for its name>
          install_profile() {
            local file="$RUNNER_TEMP/$3.mobileprovision" info="$RUNNER_TEMP/$3.plist"
            echo -n "$1" | base64 --decode > "$file"
            security cms -D -i "$file" > "$info"
            local uuid name app_id
            uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$info")
            name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$info")
            app_id=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$info")
            if [ "${app_id#*.}" != "$2" ]; then
              echo "::error::The profile in $3 is for ${app_id#*.}, expected $2"
              exit 1
            fi
            cp "$file" "$PROFILES/$uuid.mobileprovision"
            echo "$3=$name" >> "$GITHUB_ENV"
          }

          install_profile "$PROFILE_APP" "$BUNDLE_ID_APP" MOA_PROFILE_App
          install_profile "$PROFILE_NOTIFICATION_SERVICE" "$BUNDLE_ID_NOTIFICATION_SERVICE" MOA_PROFILE_NotificationService
          install_profile "$PROFILE_SHARE_EXTENSION" "$BUNDLE_ID_SHARE_EXTENSION" MOA_PROFILE_ShareExtension

      # Manual signing for all three targets. The project says Automatic, and
      # command-line settings win over it. The profile is chosen per target by
      # expanding MOA_PROFILE_<target name>: a single PROVISIONING_PROFILE_SPECIFIER
      # would hand the app's profile to the extensions. Targets with no such
      # variable (the Pods) get an empty specifier, which is what they need.
      - name: Archive
        working-directory: mobile/ios/App
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          # The $(...) below is for xcodebuild, not the shell.
          # shellcheck disable=SC2016
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            MARKETING_VERSION="${{ steps.version.outputs.marketing }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            CODE_SIGN_STYLE=Manual \
            "CODE_SIGN_IDENTITY=Apple Distribution" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            'PROVISIONING_PROFILE_SPECIFIER=$(MOA_PROFILE_$(TARGET_NAME))' \
            "MOA_PROFILE_App=$MOA_PROFILE_App" \
            "MOA_PROFILE_NotificationService=$MOA_PROFILE_NotificationService" \
            "MOA_PROFILE_ShareExtension=$MOA_PROFILE_ShareExtension"

      - name: Export the ipa
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          # Built with PlistBuddy rather than a heredoc so that a profile name
          # with an ampersand or a quote cannot produce a broken plist.
          EXPORT="$RUNNER_TEMP/export.plist"
          rm -f "$EXPORT"
          PB=/usr/libexec/PlistBuddy
          $PB -c 'Add :method string app-store-connect' "$EXPORT"
          $PB -c 'Add :signingStyle string manual' "$EXPORT"
          $PB -c 'Add :signingCertificate string "Apple Distribution"' "$EXPORT"
          $PB -c "Add :teamID string $TEAM_ID" "$EXPORT"
          $PB -c 'Add :uploadSymbols bool true' "$EXPORT"
          $PB -c 'Add :destination string export' "$EXPORT"
          $PB -c 'Add :provisioningProfiles dict' "$EXPORT"
          $PB -c "Add :provisioningProfiles:$BUNDLE_ID_APP string $MOA_PROFILE_App" "$EXPORT"
          $PB -c "Add :provisioningProfiles:$BUNDLE_ID_NOTIFICATION_SERVICE string $MOA_PROFILE_NotificationService" "$EXPORT"
          $PB -c "Add :provisioningProfiles:$BUNDLE_ID_SHARE_EXTENSION string $MOA_PROFILE_ShareExtension" "$EXPORT"
          plutil -lint "$EXPORT"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$EXPORT"

      # The API key is written to disk because altool reads it from there, and
      # removed in the same step whatever happens: a private key outliving the
      # job is the one thing this workflow must not leave behind.
      - name: Upload to App Store Connect
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          KEYDIR=~/private_keys
          mkdir -p "$KEYDIR"
          trap 'rm -rf "$KEYDIR"' EXIT
          echo -n "$API_KEY_P8" | base64 --decode \
            > "$KEYDIR/AuthKey_$API_KEY_ID.p8"

          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/App.ipa" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

      - name: Keep the archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: ignore
          retention-days: 7
