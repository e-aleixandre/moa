apply plugin: 'com.android.application'

// A release APK takes its version from MOA_ANDROID_VERSION, the moa release
// (MAJOR.MINOR.PATCH), so versionCode rises with every release without anyone
// bumping it: MAJOR*10000 + MINOR*100 + PATCH. Without it (debug, CI) the
// version stays 1 / "1.0".
def moaVersion = System.getenv('MOA_ANDROID_VERSION')
def moaVersionCode = 1
def moaVersionName = "1.0"
if (moaVersion) {
    def m = moaVersion =~ /^(\d+)\.(\d+)\.(\d+)$/
    if (!m.matches()) {
        throw new GradleException("MOA_ANDROID_VERSION must be MAJOR.MINOR.PATCH, got '${moaVersion}'")
    }
    def (major, minor, patch) = (1..3).collect { m.group(it) as int }
    // Two digits each, or 0.100.0 would collide with 1.0.0.
    if (minor > 99 || patch > 99) {
        throw new GradleException("MOA_ANDROID_VERSION minor and patch must be at most 99, got '${moaVersion}'")
    }
    moaVersionCode = major * 10000 + minor * 100 + patch
    if (moaVersionCode < 1) {
        throw new GradleException("MOA_ANDROID_VERSION must be above 0.0.0")
    }
    moaVersionName = moaVersion
}

android {
    namespace = "com.ealeixandre.moa.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.ealeixandre.moa.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode moaVersionCode
        versionName moaVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Must equal the paired server's push.relay_url (as MOA_PUSH_RELAY_URL
        // on iOS). Override with -PmoaPushRelayUrl=https://... when building.
        buildConfigField "String", "MOA_PUSH_RELAY_URL",
            "\"${project.findProperty('moaPushRelayUrl') ?: 'https://moa-push-relay.ealeixandre.workers.dev'}\""
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    testOptions {
        // The push vector tests read relay/test/vectors.json from the repo.
        unitTests.all {
            systemProperty 'moa.repoRoot', rootProject.file('../..').absolutePath
        }
    }
    // Release signing comes only from the environment, so no path or secret
    // lives in the repo and nothing reaches the command line. Without
    // MOA_ANDROID_KEYSTORE the release APK is built unsigned, as before.
    def releaseKeystore = System.getenv('MOA_ANDROID_KEYSTORE')
    // Once signing is requested, every part must be given: no default alias.
    // The message names the variable, never its value.
    def requiredSigningEnv = { String name ->
        def value = System.getenv(name)
        if (!value) {
            throw new GradleException("MOA_ANDROID_KEYSTORE is set but ${name} is missing")
        }
        value
    }
    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword requiredSigningEnv('MOA_ANDROID_KEYSTORE_PASSWORD')
                keyAlias requiredSigningEnv('MOA_ANDROID_KEY_ALIAS')
                // PKCS12 keystores have a single password for store and key.
                keyPassword requiredSigningEnv('MOA_ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (releaseKeystore) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation platform("com.google.firebase:firebase-bom:$firebaseBomVersion")
    implementation "com.google.firebase:firebase-messaging"
    // The voice call's WebSocket: the platform has no client for it.
    implementation "com.squareup.okhttp3:okhttp:$okhttpVersion"
    // Pairing QR scanner: ZXing, decoded on the device, no Google services.
    implementation "com.journeyapps:zxing-android-embedded:$zxingAndroidEmbeddedVersion"
    testImplementation "junit:junit:$junitVersion"
    // android.jar's org.json is a stub in JVM tests; the real one parses.
    testImplementation "org.json:json:$orgJsonVersion"
    testImplementation "com.squareup.okhttp3:mockwebserver:$okhttpVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// google-services.json is not committed (see mobile/README.md). Without it the
// plugin is not applied, the app still builds, and push reports "unsupported".
try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
